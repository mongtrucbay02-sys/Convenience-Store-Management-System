name: SmartMart CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable CI service only; never an Aiven/deployment credential.
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
          TZ: Asia/Ho_Chi_Minh
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-only-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ConvenienceStoreManagement.slnx

      - name: Build
        run: dotnet build ConvenienceStoreManagement.slnx --configuration Release --no-restore

      - name: Test with isolated MySQL
        env:
          # Fixtures create/migrate/drop their own cuahang_test_* databases.
          ConnectionStrings__CuaHangTest: "Server=127.0.0.1;Port=${{ job.services.mysql.ports['3306'] }};User ID=root;Password=ci-only-password;SslMode=Preferred;AllowPublicKeyRetrieval=True;"
        run: >-
          dotnet test tests/ConvenienceStore.Web.Tests/ConvenienceStore.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          --results-directory artifacts/test-results
          --logger "trx;LogFileName=tests.trx"

      - name: Verify test execution
        shell: pwsh
        run: ./scripts/ci/verify-trx.ps1 -Path artifacts/test-results/tests.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 7
