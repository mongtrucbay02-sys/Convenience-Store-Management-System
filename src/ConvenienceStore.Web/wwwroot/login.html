
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Cửa hàng tiện lợi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #eef4f8;
        }

        .login-box {
            background: white;
            width: 380px;
            max-width: 92%;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background: #105080;
            }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #c62828;
        }
    </style>
</head>

<body>
    <div class="login-box">

        <h2>ĐĂNG NHẬP HỆ THỐNG</h2>

        <form id="loginForm">

            <label for="username">
                Tên đăng nhập
            </label>

            <input type="text"
                   id="username"
                   required
                   autocomplete="username"
                   placeholder="Nhập tên đăng nhập">

            <label for="password">
                Mật khẩu
            </label>

            <input type="password"
                   id="password"
                   required
                   autocomplete="current-password"
                   placeholder="Nhập mật khẩu">

            <button type="submit">
                Đăng nhập
            </button>

            <div id="message"
                 class="message"
                 role="alert">
            </div>

        </form>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
