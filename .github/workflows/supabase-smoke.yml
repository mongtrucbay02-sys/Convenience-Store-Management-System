name: Supabase smoke test

on:
  workflow_dispatch:
  push:
    branches: [main, develop, feature/supabase-entities-20261123]
    paths:
      - '.github/workflows/supabase-smoke.yml'
      - 'tools/SupabaseSmoke/**'
      - 'src/ConvenienceStore.Web/**'

permissions:
  contents: read

concurrency:
  group: supabase-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-readonly:
    name: Supabase - read-only connection and EF mapping
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tools/SupabaseSmoke/SupabaseSmoke.csproj

      - name: Build
        run: dotnet build tools/SupabaseSmoke/SupabaseSmoke.csproj --configuration Release --no-restore

      - name: Provision trusted Supabase CA
        env:
          SUPABASE_DB_CA_CERT: ${{ secrets.SUPABASE_DB_CA_CERT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_CA_CERT:-}" ]; then
            echo "::error::SUPABASE_DB_CA_CERT is not configured."
            exit 1
          fi
          umask 077
          mkdir -p artifacts
          printf '%s\n' "$SUPABASE_DB_CA_CERT" > artifacts/supabase-ca.pem
          if ! openssl x509 -in artifacts/supabase-ca.pem -noout >/dev/null 2>&1; then
            echo "::error::SUPABASE_DB_CA_CERT must contain a valid PEM certificate."
            exit 1
          fi

      - name: Read 31 tables and 3 views from Supabase
        env:
          SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
        run: dotnet tools/SupabaseSmoke/bin/Release/net10.0/SupabaseSmoke.dll artifacts/supabase-smoke/result.json

      - name: Remove runner CA file
        if: always()
        shell: bash
        run: rm -f artifacts/supabase-ca.pem

      - name: Upload read-only report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supabase-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/supabase-smoke/result.json
          if-no-files-found: warn
          retention-days: 7
