components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cs_session
      description: Cookie phien HttpOnly, Secure, SameSite=Strict; 30 phut khong hoat dong
    xsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Header cho POST/PUT/DELETE, lay tu cookie XSRF-TOKEN
  responses:
    Unauthorized:
      description: 401 Chưa đăng nhập/hết phiên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Loi'
    Forbidden:
      description: 403 Không đủ quyền/bắt buộc đổi mật khẩu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Loi'
    Conflict:
      description: 409 Xung đột
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Loi'
    ValidationError:
      description: 422 Dữ liệu sai nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Loi'
    KhongTimThay:
      description: 404 Khong tim thay
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Loi'
    LoiMayChu:
      description: 500 Loi may chu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Loi'
    BadRequest:
      description: 400 Yeu cau sai cu phap
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Loi'
  schemas:
    YeuCauGanKhachHang:
      type: object
      required:
      - khachHangId
      - phienBan
      properties:
        khachHangId:
          type: integer
          nullable: true
          example: 8
        phienBan:
          type: integer
          minimum: 1
          example: 3
    YeuCauApDungKhuyenMai:
      type: object
      required:
      - phienBan
      properties:
        phienBan:
          type: integer
          minimum: 1
          example: 4
    GioHang:
      type: object
      required:
      - id
      - chiTiet
      - tongTienHang
      - tienGiam
      - thanhTien
      - phienBan
      - trangThai
      - khachHangId
      properties:
        id:
          type: integer
        khachHangId:
          type: integer
          nullable: true
        chiTiet:
          type: array
          items:
            $ref: '#/components/schemas/DongGio'
        tongTienHang:
          type: integer
        tienGiam:
          type: integer
        thanhTien:
          type: integer
        khuyenMaiApDung:
          type: array
          items:
            type: object
        phienBan:
          type: integer
        trangThai:
          type: string
          description: Enum phai khop ERD T3-13; can doi chieu truoc merge
        thoiDiemTao:
          type: string
          format: date-time
          example: '2026-10-16T08:30:00+07:00'
    Loi:
      type: object
      required:
      - code
      - message
      - details
      - traceId
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
          description: null neu khong co chi tiet
        traceId:
          type: string
    LoiTruong:
      type: object
      required:
      - truong
      - loi
      properties:
        truong:
          type: string
          example: chiTiet[0].soLuong
        loi:
          type: string
          example: So luong phai lon hon 0.
    DongGio:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        sanPhamId:
          type: integer
          minimum: 1
          example: 1
        tenSanPham:
          type: string
          example: Sua tuoi 180ml
        soLuong:
          type: integer
          minimum: 1
          example: 1
        donGia:
          type: integer
          minimum: 0
          example: 1
        tienGiam:
          type: integer
          minimum: 0
          example: 1
        thanhTien:
          type: integer
          minimum: 0
          example: 1
      required:
      - id
      - sanPhamId
      - soLuong
      - donGia
      - thanhTien
    YeuCauTaoGioHang:
      type: object
      properties: {}
      description: Body JSON rong {}; nguoi tao lay tu phien, khong truyen userId
    YeuCauThemSanPham:
      type: object
      properties:
        sanPhamId:
          type: integer
          minimum: 1
          example: 1
        soLuong:
          type: integer
          minimum: 1
          example: 1
        phienBan:
          type: integer
          minimum: 1
          example: 1
      required:
      - sanPhamId
      - soLuong
      - phienBan
    YeuCauSuaDongGio:
      type: object
      properties:
        soLuong:
          type: integer
          minimum: 1
          example: 1
        phienBan:
          type: integer
          minimum: 1
          example: 1
