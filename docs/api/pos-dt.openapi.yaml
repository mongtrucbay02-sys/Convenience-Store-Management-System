          example: 1
        tienThua:
          type: integer
          minimum: 0
          example: 1
        thoiDiemTao:
          type: string
          format: date-time
          example: '2026-10-16T08:30:00+07:00'
      required:
      - id
      - ma
      - trangThai
      - nguoiTaoId
      - chiTiet
      - tongTienHang
      - tienGiam
      - thanhTien
      - tienKhachDua
      - tienThua
      - thoiDiemTao
    TrangHoaDon:
      type: object
