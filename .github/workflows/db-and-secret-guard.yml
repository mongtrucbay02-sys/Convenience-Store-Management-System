name: DB schema and secret guard

# CONTRIBUTING.md mục 4: chỉ #2 Yến được đổi cấu trúc CSDL; không commit file .env.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  guard:
    name: Guard - schema owner and .env
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block committed .env files
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Không được commit file .env (CONTRIBUTING.md 4.3):"
            echo "$leaked"
            exit 1
          fi
          echo "Không có file .env bị commit."

      - name: Schema files may only be changed by the schema owner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SCHEMA_OWNER: phanyen06ym-ien
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'src/ConvenienceStore.Web/Data/Migrations/' \
            'src/ConvenienceStore.Web/Data/Entities/' \
            'src/ConvenienceStore.Web/Data/CuaHangDbContext*.cs')
          if [ -z "$changed" ]; then
            echo "PR không đổi cấu trúc CSDL."
            exit 0
          fi
          if [ "$PR_AUTHOR" != "$SCHEMA_OWNER" ]; then
            echo "::error::PR này sửa file cấu trúc CSDL. Chỉ $SCHEMA_OWNER được đổi cấu trúc (CONTRIBUTING.md 4.1). Hãy tạo issue 'thay đổi yêu cầu' và gán Yến."
            echo "$changed"
            exit 1
          fi
          echo "PR của người phụ trách CSDL; vẫn cần review CODEOWNERS:"
          echo "$changed"
