name: SmartMart CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      postgres-role:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-role-fixture-password
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ConvenienceStoreManagement.slnx

      - name: Build
        run: dotnet build ConvenienceStoreManagement.slnx --configuration Release --no-restore

      - name: Publish and verify PostgreSQL-only runtime
        run: dotnet publish src/ConvenienceStore.Web -c Release --no-build --no-restore -o artifacts/publish

      - name: Verify release dependencies
        shell: pwsh
        run: ./scripts/ci/verify-postgresql-runtime.ps1 -PublishPath artifacts/publish

      - name: Test with isolated PostgreSQL 17
        env:
          # Fixtures refuse non-loopback hosts and create/drop only their random smartmart_test_* databases.
          ConnectionStrings__CuaHangPostgreSqlTest: "Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=postgres;Username=postgres;Password=ci-only-postgres-password;Pooling=false;"
          # Dedicated cluster: role integration tests may change only their own disposable role.
          ConnectionStrings__CuaHangPostgreSqlRoleTest: "Host=127.0.0.1;Port=${{ job.services.postgres-role.ports['5432'] }};Database=postgres;Username=postgres;Password=ci-only-role-fixture-password;Pooling=false;"
        run: >-
          dotnet test tests/ConvenienceStore.Web.Tests/ConvenienceStore.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter "Category!=BrowserE2E"
          --results-directory artifacts/test-results
          --logger "trx;LogFileName=tests.trx"

      - name: Verify test execution
        shell: pwsh
        run: ./scripts/ci/verify-trx.ps1 -Path artifacts/test-results/tests.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 7
