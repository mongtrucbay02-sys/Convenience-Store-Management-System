name: QA NFR isolated benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/qa-nfr-benchmark.yml'
      - 'tests/ConvenienceStore.Web.Tests/PostgreSql/PostgreSqlRuntimeTests.NfrBench.cs'
      - 'src/ConvenienceStore.Web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfr-http:
    name: 1000 products + 10000 invoices, 5 simulated users (PG17 isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-nfr-password
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ConvenienceStoreManagement.slnx
      - name: Build
        run: dotnet build ConvenienceStoreManagement.slnx -c Release --no-restore
      - name: Measure HTTP proxy NFR workload using local synthetic data
        env:
          ConnectionStrings__CuaHangPostgreSqlTest: "Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=postgres;Username=postgres;Password=ci-only-nfr-password;Pooling=false;"
        run: >-
          dotnet test tests/ConvenienceStore.Web.Tests/ConvenienceStore.Web.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter "Category=NFRBench"
          --results-directory artifacts/nfr
          --logger "trx;LogFileName=nfr.trx"
      - name: Upload raw measurements and TRX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nfr-1000-10000-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nfr/**
          if-no-files-found: warn
          retention-days: 7
