name: QA isolated backup rehearsal
on:
  pull_request:
    paths:
      - '.github/workflows/qa-backup-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Backup and restore synthetic data on disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          container="qa-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for i in $(seq 1 60); do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$container" pg_isready -h 127.0.0.1 -U postgres
          docker exec "$container" createdb -U postgres qa_source
          docker exec "$container" createdb -U postgres qa_restore
          docker exec "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d qa_source -c "CREATE TABLE synthetic_stock(id integer PRIMARY KEY, quantity integer CHECK(quantity >= 0)); INSERT INTO synthetic_stock VALUES (1,20),(2,18);"
          mkdir -p evidence
          start=$(date +%s)
          docker exec "$container" pg_dump -U postgres -Fc qa_source > evidence/synthetic.dump
          sha256sum evidence/synthetic.dump > evidence/checksum.txt
          sha256sum -c evidence/checksum.txt
          docker exec -i "$container" pg_restore -U postgres --exit-on-error --no-owner -d qa_restore < evidence/synthetic.dump
          for db in qa_source qa_restore; do
            docker exec "$container" psql -X -At -v ON_ERROR_STOP=1 -U postgres -d "$db" -c 'SELECT id,quantity FROM synthetic_stock ORDER BY id' > "evidence/$db.txt"
          done
          diff -u evidence/qa_source.txt evidence/qa_restore.txt
          printf 'Synthetic PG17 rehearsal PASS; elapsed=%ss; SHA=%s\n' "$(( $(date +%s)-start ))" "$GITHUB_SHA" | tee evidence/result.txt
          rm evidence/synthetic.dump
      - name: Upload synthetic rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-backup-rehearsal
          path: |
            evidence/result.txt
            evidence/checksum.txt
            evidence/qa_source.txt
            evidence/qa_restore.txt

      - name: Restore complete Smart Mart schema and reference rows on disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          container="qa-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for i in $(seq 1 60); do
            if docker exec "$container" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$container" pg_isready -h 127.0.0.1 -U postgres
          docker exec "$container" createdb -U postgres smartmart_source
          docker exec "$container" createdb -U postgres smartmart_restored
          docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d smartmart_source < docs/db/schema_postgresql.sql > /dev/null
          docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d smartmart_source < docs/db/seed_postgresql_reference.sql > /dev/null
          mkdir -p evidence
          docker exec "$container" pg_dump -U postgres -Fc --schema=smartmart smartmart_source > evidence/smartmart-full.dump
          sha256sum evidence/smartmart-full.dump > evidence/smartmart-full-checksum.txt
          sha256sum -c evidence/smartmart-full-checksum.txt
          docker exec -i "$container" pg_restore --exit-on-error --no-owner --no-acl -U postgres -d smartmart_restored < evidence/smartmart-full.dump
          for db in smartmart_source smartmart_restored; do
            docker exec "$container" psql -X -At -v ON_ERROR_STOP=1 -U postgres -d "$db" -c "
              SELECT 'tables', COUNT(*) FROM information_schema.tables
              WHERE table_schema='smartmart' AND table_type='BASE TABLE'
              UNION ALL SELECT 'views',COUNT(*) FROM information_schema.views WHERE table_schema='smartmart'
              UNION ALL SELECT 'roles', COUNT(*) FROM smartmart.vai_tro
              UNION ALL SELECT 'loyalty_rules', COUNT(*) FROM smartmart.quy_tac_tich_diem
              UNION ALL SELECT 'return_policies', COUNT(*) FROM smartmart.chinh_sach_doi_tra
              UNION ALL SELECT 'cash_ledgers', COUNT(*) FROM smartmart.quy_tien_mat
              ORDER BY 1;" > "evidence/full-$db.txt"
          done
          diff -u evidence/full-smartmart_source.txt evidence/full-smartmart_restored.txt
          grep -q 'tables|31' evidence/full-smartmart_restored.txt
          grep -q 'views|3' evidence/full-smartmart_restored.txt
          grep -q 'roles|3' evidence/full-smartmart_restored.txt
          echo "Full-schema PG17 baseline + reference-data restore PASS at SHA ${GITHUB_SHA}" | tee evidence/full-result.txt
          rm -f evidence/smartmart-full.dump
      - name: Upload full-schema rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-full-schema-rehearsal
          path: |
            evidence/full-result.txt
            evidence/smartmart-full-checksum.txt
            evidence/full-smartmart_source.txt
            evidence/full-smartmart_restored.txt
          if-no-files-found: warn
          retention-days: 7
