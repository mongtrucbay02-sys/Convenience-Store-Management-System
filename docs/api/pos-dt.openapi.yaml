          example: 1
        tienGiam:
          type: integer
          minimum: 0
          example: 1
        thanhTien:
          type: integer
          minimum: 0
          example: 1
      required:
      - id
      - sanPhamId
      - soLuong
      - donGia
      - thanhTien
    HoaDon:
      type: object
