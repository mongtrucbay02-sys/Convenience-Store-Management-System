<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đổi mật khẩu — Smart Mart</title>
<link rel="stylesheet" href="/css/auth-rieng.css"><script src="/js/auth-rieng.js" defer></script></head>
<body data-mode="change"><main class="auth-shell">
<section class="auth-art"><a class="brand" href="/">◉ SMART MART</a><strong>Ghé nhanh.<br>Bùng vị.</strong><span>Hệ thống dành cho nhân viên</span></section>
<section class="auth-card"><span class="kicker">TÀI KHOẢN NHÂN VIÊN</span><h1>Đổi mật khẩu</h1>
<form id="auth-form">
<label for="current">Mật khẩu hiện tại</label><input id="current" type="password" autocomplete="current-password" required maxlength="128">
<label for="password">Mật khẩu mới</label><input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
<label for="confirm">Nhập lại mật khẩu mới</label><input id="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
<button class="submit" type="submit">Lưu mật khẩu mới</button></form>
<p id="message" role="status" aria-live="polite"></p><a href="/">← Về trang chủ</a>
</section></main></body></html>
