          type: string
          enum:
          - K80
          example: K80
      required:
      - hoaDon
      - khoGiay
      description: JSON, frontend dung CSS K80 va window.print()
    TrangGioHang:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GioHang'
        total:
          type: integer
          minimum: 0
          example: 1
        page:
          type: integer
          minimum: 1
          example: 1
        size:
          type: integer
